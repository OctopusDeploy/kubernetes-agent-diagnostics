name: Release

# Build single-file binaries with PyInstaller and attach them to a GitHub
# Release whenever a version tag is pushed (e.g. v1.0.0).
#
# To cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# You can also trigger this manually from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 test_octopus_agent_diag.py

  build:
    name: Build ${{ matrix.target.name }}
    needs: test
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-amd64
            os: ubuntu-latest
            asset: octopus-agent-diag-linux-amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset: octopus-agent-diag-linux-arm64
          - name: macos-arm64
            os: macos-14       # Apple Silicon runner
            asset: octopus-agent-diag-macos-arm64
          - name: windows-amd64
            os: windows-latest
            asset: octopus-agent-diag-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip "pyinstaller==6.19.0" "pyinstaller-hooks-contrib>=2025.1"

      - name: Build binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name "${{ matrix.target.asset }}" \
            --console \
            --noupx \
            octopus-agent-diag.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name "${{ matrix.target.asset }}" `
            --console `
            --noupx `
            octopus-agent-diag.py

      - name: Smoke test — run --help
        if: runner.os != 'Windows'
        run: "./dist/${{ matrix.target.asset }} --help"

      - name: Smoke test — run --help (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "./dist/${{ matrix.target.asset }} --help"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.asset }}
          path: dist/${{ matrix.target.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only create a release for tag pushes — skip for manual runs
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum octopus-agent-diag-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/octopus-agent-diag-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Octopus Kubernetes agent diagnostics — ${{ github.ref_name }}

            Download the binary for your platform below and run it. No Python
            installation required.

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux    | x86_64       | `octopus-agent-diag-linux-amd64` |
            | Linux    | ARM64        | `octopus-agent-diag-linux-arm64` |
            | macOS    | Apple Silicon| `octopus-agent-diag-macos-arm64` |
            | Windows  | x86_64       | `octopus-agent-diag-windows-amd64.exe` |

            `SHA256SUMS.txt` contains checksums for verification.

            ### Quick start

            ```bash
            # macOS (Apple Silicon)
            chmod +x octopus-agent-diag-macos-arm64
            xattr -d com.apple.quarantine ./octopus-agent-diag-macos-arm64
            ./octopus-agent-diag-macos-arm64
            ```

            ```bash
            # Linux
            chmod +x octopus-agent-diag-<your-platform>
            ./octopus-agent-diag-<your-platform>
            ```

            ```powershell
            # Windows
            .\octopus-agent-diag-windows-amd64.exe
            ```
